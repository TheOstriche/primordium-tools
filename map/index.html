<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121019">
  <title>Primordium Map</title>
  <!-- Shared look: fonts, ../shared/theme.css (colors, components), ../shared/theme.js (light/dark, runs before drawing) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" id="fonts" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../shared/theme.css">
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../" title="Back to Primordium Tools">Primordium <span>Map</span></a>
    <div class="tools" role="toolbar" aria-label="Map tools">
      <div class="menu-wrap"><button type="button" id="btn-add">Add</button></div>
      <button type="button" id="btn-measure" aria-pressed="false" title="Measure a distance (M)">Measure</button>
      <span class="sep"></span>
      <button type="button" id="btn-undo" title="Undo (Ctrl+Z)">Undo</button>
      <button type="button" id="btn-redo" title="Redo (Ctrl+Y)">Redo</button>
      <span class="sep"></span>
      <button type="button" id="btn-out" class="icon" aria-label="Zoom out" title="Zoom out (-)">&minus;</button>
      <button type="button" id="btn-fit" title="Show the whole map (0)"><span id="zoom">100%</span></button>
      <button type="button" id="btn-in" class="icon" aria-label="Zoom in" title="Zoom in (+)">+</button>
    </div>
    <div class="save-status" id="status" role="status"></div>
    <button type="button" id="btn-save" class="primary" title="Save the map to its file (Ctrl+S)">Save</button>
    <div class="menu-wrap right"><button type="button" id="btn-more">More</button></div>
    <button type="button" data-theme-toggle></button>
  </header>
  <div id="banner" hidden></div>

  <div class="work">
    <aside class="side" aria-label="Features, layers, and checks">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="features" aria-selected="true">Features</button>
        <button type="button" role="tab" data-tab="layers" aria-selected="false">Layers</button>
        <button type="button" role="tab" data-tab="checks" aria-selected="false">Checks</button>
      </div>
      <div class="side-body" id="left"></div>
    </aside>
    <main class="stage" id="stage">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The world map of Primordium"></svg>
      <div class="hint" id="hint" role="status" hidden></div>
      <div class="hud"><span id="coords"></span></div>
    </main>
    <aside class="side" aria-label="Details">
      <div class="side-body" id="right"></div>
    </aside>
  </div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <input type="file" id="file" accept=".json,application/json" hidden>

  <!-- The map: its data (generated from shared/map/primordium-map.json) and the rules of that data -->
  <script src="../shared/map/map-data.js"></script>
  <script src="../shared/map/map-model.js"></script>
  <!-- App -->
  <script src="js/ui.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/view.js"></script>
  <script src="js/store.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
