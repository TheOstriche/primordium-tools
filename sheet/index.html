<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121019">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Primordium">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<!-- Shared look: ../shared/theme.css (colors, components) and ../shared/theme.js (light/dark; runs before drawing) -->
<link rel="stylesheet" href="../shared/theme.css">
<script src="../shared/theme.js"></script>
<link rel="stylesheet" href="style.css">
<title>Primordium Character Sheet</title>
</head>
<body>
<header class="top">
  <button id="backBtn" class="iconbtn" aria-label="All characters" hidden>‹</button>
  <h1 id="title">Primordium</h1>
  <button type="button" data-theme-toggle></button>
  <button id="menuBtn" class="iconbtn" aria-label="Backup and settings">⋯</button>
</header>
<main id="view"></main>
<nav id="tabs" class="tabs" hidden></nav>
<dialog id="menu">
  <h2>Backup</h2>
  <p>Characters are saved on this device. Export a backup to move them to another phone or keep them safe.</p>
  <button id="exportBtn" class="btn">Export all characters</button>
  <label class="btn ghost">Import a backup<input id="importFile" type="file" accept="application/json" hidden></label>
  <h2 style="margin-top:18px">Effects</h2>
  <p>Crits, card plays from Rare to Mythic, and other flourishes. Shared with the Codex on this phone. The light or dark theme is the round button at the top.</p>
  <div id="fxPrefs"></div>
  <button id="closeMenu" class="btn ghost">Close</button>
</dialog>
<dialog id="sheet" class="bottom" aria-label="Choose"></dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>
<!-- Shared rules and game data (../shared/), then the sheet's own lists and code, in this order -->
<script src="../shared/core.js"></script>
<script src="../shared/primordium-data.js"></script>
<script src="../shared/character-rules.js"></script>
<script src="../shared/dice.js"></script>
<script src="../shared/tactics-deck.js"></script>
<script src="../shared/fx.js"></script>
<script src="data.js"></script>
<script src="js/store.js"></script>
<script src="js/rules.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/sheets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
