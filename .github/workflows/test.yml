# Runs every test when changes are pushed, so a mistake in the data or code shows up as a red mark on GitHub
# (and an email) instead of on a player's phone. It only checks; it does not change or publish anything.
name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tools/test.js
