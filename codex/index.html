<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121019">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Codex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<title>Primordium Codex</title>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1>Primordium <b>Codex</b></h1><small>Rules 2.0</small></div>
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search skills, creatures, rules…" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="qclear" hidden>Clear</button>
    </label>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<div class="toast" id="toast" role="status"><div class="total" id="t-total">–</div><div class="what" id="t-what"></div></div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5V5.5M9 7h7M9 11h7"/></svg>Codex</button>
  <button data-tab="skills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14.5 3.5 20.5 9.5 9 21H3v-6z"/><path d="m12 6 6 6"/></svg>Skills</button>
  <button data-tab="beasts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4c2 1 3 3 3 5M19 4c-2 1-3 3-3 5"/><path d="M5 9h14l-1.5 6.5A6 6 0 0 1 12 20a6 6 0 0 1-5.5-4.5z"/><circle cx="9.5" cy="13" r=".8" fill="currentColor"/><circle cx="14.5" cy="13" r=".8" fill="currentColor"/></svg>Bestiary</button>
  <button data-tab="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v18M5 7h14M7 7l-3 7a3 3 0 0 0 6 0zM17 7l-3 7a3 3 0 0 0 6 0z"/></svg>Rules</button>
  <button data-tab="dice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2.5 20.5 7.5v9L12 21.5 3.5 16.5v-9z"/><path d="M12 2.5 7.5 15h9zM3.5 7.5 7.5 15 12 21.5 16.5 15l4-7.5"/></svg>Dice</button>
</div></nav>

<script src="../shared/primordium-data.js"></script>
<script src="../shared/npc-data.js"></script>
<script src="codex-data.js"></script>
<script src="app.js"></script>
</body>
</html>
