<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121019">
  <title>Primordium GM</title>
  <!-- Shared look: fonts, ../shared/theme.css (colors, components), ../shared/theme.js (light/dark, runs before drawing) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../shared/theme.css">
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Primordium <span>GM</span></h1>
    <nav class="tabs" id="tabs">
      <button data-view="encounter" class="active">Encounter</button>
      <button data-view="combat">Combat</button>
      <button data-view="reference">Reference</button>
      <button data-view="creatures">NPC types</button>
      <button data-view="save">Save</button>
    </nav>
    <div class="save-status" id="save-status"></div>
    <button type="button" data-theme-toggle></button>
  </header>

  <main>
    <section class="view active" id="view-encounter"></section>
    <section class="view" id="view-combat"></section>
    <section class="view" id="view-reference"></section>
    <section class="view" id="view-creatures"></section>
    <section class="view" id="view-save"></section>
  </main>

  <!-- Shared rules and game data -->
  <script src="../shared/core.js"></script>
  <script src="../shared/npc-data.js"></script>
  <script src="../shared/primordium-data.js"></script>
  <script src="../shared/character-rules.js"></script>
  <script src="../shared/fx.js"></script>
  <script src="data/scaling-data.js"></script>
  <script src="data/docs-data.js"></script>
  <!-- App -->
  <script src="js/rules.js"></script>
  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/combat-engine.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/save-view.js"></script>
  <script src="js/encounter.js"></script>
  <script src="js/combat-view.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/reference.js"></script>
  <script src="js/creatures.js"></script>
</body>
</html>
